name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PDFFORGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Set PDFFORGE_KEYSTORE_BASE64 in repository Actions secrets before building."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pdfforge-release.jks"
          chmod 600 "$RUNNER_TEMP/pdfforge-release.jks"
      - name: Build signed release APK
        env:
          PDF_FORGE_KEYSTORE_PATH: ${{ runner.temp }}/pdfforge-release.jks
          PDF_FORGE_KEYSTORE_PASSWORD: ${{ secrets.PDFFORGE_SIGNING_PASSWORD }}
          PDF_FORGE_KEY_ALIAS: pdfforge
          PDF_FORGE_KEY_PASSWORD: ${{ secrets.PDFFORGE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$PDF_FORGE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set PDFFORGE_SIGNING_PASSWORD in repository Actions secrets."
            exit 1
          fi
          gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PDFForge-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
